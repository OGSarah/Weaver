name: Go tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: go test
    runs-on: ubuntu-latest

    # Most of what is worth testing here is a transaction: a claim that must not
    # double-issue, a cancel racing a claim, a reaper deciding a task's fate. Those
    # only mean anything against a real Postgres, so CI runs one rather than
    # skipping every test that needs it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: weaver
          POSTGRES_PASSWORD: weaver_dev_password
          POSTGRES_DB: weaver_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weaver"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://weaver:weaver_dev_password@localhost:5432/weaver_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The migrations are plain SQL applied in order, so psql is enough and the
      # job needs no migration tool of its own.
      - name: Apply migrations
        run: |
          for f in migrations/*.up.sql; do
            echo "applying $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - run: go build ./...
      - run: go test -race ./...
