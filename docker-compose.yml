services:
  postgres:
    image: postgres:16
    container_name: weaver-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: weaver
      POSTGRES_PASSWORD: weaver_dev_password
      POSTGRES_DB: weaver
    ports:
      - "5432:5432"
    volumes:
      - weaver_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weaver -d weaver"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Applies migrations once, then exits. Workers wait for it to finish so they
  # never poll a schema that isn't there yet.
  migrate:
    image: migrate/migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://weaver:weaver_dev_password@postgres:5432/weaver?sslmode=disable"
      - "up"

  # The REST API: the front door for registering workflows, triggering runs, and
  # inspecting state. Stateless over the database, so it could scale too, but one
  # replica is plenty for local dev.
  api:
    build:
      context: .
      args:
        BINARY: api
    container_name: weaver-api
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://weaver:weaver_dev_password@postgres:5432/weaver?sslmode=disable
      API_ADDR: ":8080"
      # The UI is baked into the image by the Dockerfile's web stage, which is what
      # keeps the built bundle out of version control. Nothing is mounted from the
      # host, so a frontend change needs `docker compose up --build` to appear.
      # For an edit-refresh loop, run the API on the host instead (see the README):
      # it defaults to ./web, where `npm run dev` is writing.
      WEB_DIR: /web
    ports:
      - "8080:8080"
    restart: unless-stopped

  # The control-plane scheduler. Runs the reaper, which returns tasks stranded by
  # dead workers to the queue, and the cron scheduler, which creates runs when a
  # workflow's schedule comes due. A single replica is enough (SKIP LOCKED and the
  # per-slot unique index make more safe, just redundant), so unlike the worker it
  # keeps a container_name.
  scheduler:
    build:
      context: .
      args:
        BINARY: scheduler
    container_name: weaver-scheduler
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://weaver:weaver_dev_password@postgres:5432/weaver?sslmode=disable
    restart: unless-stopped

  # The task worker. No container_name and no fixed hostname, so it scales:
  #   docker compose up --build --scale worker=2
  # Each replica gets its own hostname, which becomes its worker id.
  worker:
    build:
      context: .
      args:
        BINARY: worker
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://weaver:weaver_dev_password@postgres:5432/weaver?sslmode=disable
    restart: unless-stopped

volumes:
  weaver_pgdata: